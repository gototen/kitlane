<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Briefs editor</title>
  <style>
    :root { --bg: #f6f7f9; --fg: #1b1f24; --muted: #5d6672; --card: #fff; --line: #dde1e6; --accent: #2457d6; --accent-fg: #fff; --danger: #b42318; --notice-bg: #eef3ff; --notice-fg: #1c3a8a; --warn-bg: #fff4d6; --warn-fg: #5a4300; --error-bg: #fdecec; --error-fg: #b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg: #101317; --fg: #e6e8eb; --muted: #9aa4b1; --card: #171b21; --line: #2a3039; --accent: #6b93ff; --accent-fg: #0b1226; --danger: #ff7b72; --notice-bg: #172448; --notice-fg: #cdd9ff; --warn-bg: #3a2f10; --warn-fg: #ffe9a8; --error-bg: #3a1a1a; --error-fg: #ff7b72; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
    header { display: flex; align-items: center; gap: .8rem; padding: .6rem 1rem; border-bottom: 1px solid var(--line); background: var(--card); flex-wrap: wrap; }
    header h1 { font-size: 1.1rem; margin: 0; }
    header .spacer { flex: 1; }
    .status { font-size: .85rem; color: var(--muted); }
    main { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; min-height: 0; }
    nav { border-right: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; min-height: 0; }
    nav ul { list-style: none; margin: 0; padding: .3rem; overflow: auto; flex: 1; }
    nav li button { width: 100%; text-align: left; background: none; border: 0; border-radius: .4rem; padding: .5rem .6rem; cursor: pointer; font: inherit; color: inherit; }
    nav li button:hover { background: var(--bg); }
    nav li button[aria-current="true"] { background: var(--notice-bg); color: var(--notice-fg); }
    nav .toolbar { padding: .6rem; border-bottom: 1px solid var(--line); display: flex; gap: .4rem; }
    section.editor { overflow: auto; padding: 1rem 1.5rem; }
    form { display: grid; gap: .7rem; max-width: 56rem; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: .7rem; }
    label { display: flex; flex-direction: column; gap: .2rem; font-size: .88rem; color: var(--muted); }
    input, textarea { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: .4rem; padding: .45rem .6rem; width: 100%; }
    textarea { min-height: 5rem; resize: vertical; }
    input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
    button { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: .45rem; padding: .45rem .9rem; cursor: pointer; }
    button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 600; }
    button.danger { color: var(--danger); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .banner { padding: .6rem 1rem; }
    .banner.notice { background: var(--notice-bg); color: var(--notice-fg); }
    .banner.warn { background: var(--warn-bg); color: var(--warn-fg); }
    .banner.error { background: var(--error-bg); color: var(--error-fg); }
    .banner[hidden] { display: none; }
    .empty { color: var(--muted); }
    .conflict { border: 1px solid var(--danger); border-radius: .7rem; padding: .9rem 1rem; margin-top: 1rem; background: var(--card); }
    .conflict h3 { margin: 0 0 .4rem; font-size: 1rem; }
    .compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: .8rem; }
    pre { background: var(--bg); border: 1px solid var(--line); border-radius: .5rem; padding: .6rem; overflow: auto; font-size: .82rem; max-height: 18rem; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; } }
  </style>
</head>
<body>
  <header>
    <h1>Briefs editor</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <span class="spacer"></span>
    <button type="button" id="export">Export JSON</button>
  </header>
  <div class="banner" id="banner" hidden role="alert"></div>
  <main>
    <nav aria-label="Briefs">
      <div class="toolbar">
        <button type="button" id="new" class="primary" disabled>New brief</button>
        <button type="button" id="reload">Reload</button>
      </div>
      <ul id="list" aria-label="Brief list"></ul>
    </nav>
    <section class="editor" id="editor">
      <p class="empty">Select a brief to edit, or create a new one.</p>
    </section>
  </main>
  <script src="/._kitlane/sdk.js"></script>
  <script>
    (function () {
      var col = kitlane.shared.collection("company-briefs");
      var state = { items: [], revision: null, selected: null, canWrite: false, blockedReason: null, draftNew: false, conflict: null, confirmDelete: false };
      var $ = function (id) { return document.getElementById(id); };
      function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
      function banner(kind, html) { var b = $("banner"); if (!html) { b.hidden = true; return; } b.className = "banner " + kind; b.innerHTML = html; b.hidden = false; }
      function setStatus(t) { $("status").textContent = t; }
      function lines(arr) { return (arr || []).join("\n"); }
      function splitLines(s) { return String(s || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
      function fail(err) {
        if (err && err.code === "unauthenticated") banner("error", "Your session on this tool has expired. Reload the page to sign in again.");
        else if (err && err.code === "frozen") banner("error", "This collection or tool has been frozen by an administrator. " + escapeHtml(err.message));
        else if (err && err.code === "forbidden") banner("warn", "Write rejected: " + escapeHtml(err.message));
        else banner("error", "Something went wrong: " + escapeHtml(err && err.message ? err.message : String(err)));
      }
      function currentDoc() { return state.items.find(function (d) { return d.id === state.selected; }) || null; }

      function renderList() {
        $("list").innerHTML = state.items.length ? state.items.map(function (d) {
          return '<li><button type="button" data-id="' + escapeHtml(d.id) + '" aria-current="' + (state.selected === d.id && !state.draftNew) + '">' + escapeHtml(d.data.name || d.id) + "</button></li>";
        }).join("") : '<li><span class="empty" style="display:block;padding:.5rem .6rem">No briefs yet.</span></li>';
      }

      function field(label, name, value, multiline, hint) {
        var id = "f-" + name;
        return '<label for="' + id + '">' + label + (hint ? ' <span>(' + hint + ')</span>' : "") + (multiline
          ? '<textarea id="' + id + '" name="' + name + '"' + (state.canWrite ? "" : " readonly") + '>' + escapeHtml(value) + '</textarea>'
          : '<input id="' + id + '" name="' + name + '" value="' + escapeHtml(value) + '"' + (state.canWrite ? "" : " readonly") + '>') + "</label>";
      }

      function renderEditor() {
        var doc = state.draftNew ? null : currentDoc();
        if (!doc && !state.draftNew) { $("editor").innerHTML = '<p class="empty">Select a brief to edit, or create a new one.</p>'; return; }
        var b = doc ? doc.data : { name: "", sector: "", hq: "", founded: "", employees: "", summary: "", talkingPoints: [], recentNews: [], risks: [] };
        var ro = !state.canWrite;
        $("editor").innerHTML =
          '<form id="form" autocomplete="off">' +
          (state.draftNew ? field("Document id", "id", "", false, "lowercase slug, e.g. acme-anvils") : '<p class="empty">Document <code>' + escapeHtml(doc.id) + '</code> · revision ' + doc.revision + ' · updated ' + escapeHtml(new Date(doc.updatedAt).toLocaleString()) + (doc.updatedBy ? ' by <code>' + escapeHtml(doc.updatedBy) + '</code>' : "") + '</p>') +
          '<div class="row">' + field("Name", "name", b.name) + field("Sector", "sector", b.sector) + field("Headquarters", "hq", b.hq) + '</div>' +
          '<div class="row">' + field("Founded", "founded", b.founded) + field("Employees", "employees", b.employees) + '</div>' +
          field("Summary", "summary", b.summary, true) +
          field("Talking points", "talkingPoints", lines(b.talkingPoints), true, "one per line") +
          field("Recent news", "recentNews", lines(b.recentNews), true, "one per line") +
          field("Risks", "risks", lines(b.risks), true, "one per line") +
          '<div class="actions">' +
          (ro ? '<span class="empty">Read only in this tool.</span>' :
            '<button type="submit" class="primary" id="save">' + (state.draftNew ? "Create" : "Save") + '</button>' +
            (doc ? (state.confirmDelete
              ? '<button type="button" class="danger" id="delete-confirm">Yes, delete this brief</button><button type="button" id="delete-cancel">Cancel</button>'
              : '<button type="button" class="danger" id="delete">Delete…</button>') : "") +
            '<span class="status" id="save-status"></span>') +
          '</div></form>' +
          '<div id="conflict"></div>';
        $("form").addEventListener("submit", onSave);
        var d = $("delete"); if (d) d.onclick = function () { state.confirmDelete = true; renderEditor(); };
        var dc = $("delete-cancel"); if (dc) dc.onclick = function () { state.confirmDelete = false; renderEditor(); };
        var dy = $("delete-confirm"); if (dy) dy.onclick = onDelete;
        renderConflict();
      }

      function readForm() {
        var f = $("form");
        var get = function (n) { return f.elements[n] ? f.elements[n].value.trim() : ""; };
        var founded = get("founded"), employees = get("employees");
        return {
          id: get("id"),
          data: {
            name: get("name"), sector: get("sector"), hq: get("hq"),
            founded: founded === "" ? null : (isNaN(Number(founded)) ? founded : Number(founded)),
            employees: employees === "" ? null : (isNaN(Number(employees)) ? employees : Number(employees)),
            summary: get("summary"),
            talkingPoints: splitLines(get("talkingPoints")), recentNews: splitLines(get("recentNews")), risks: splitLines(get("risks")),
            updatedAt: new Date().toISOString()
          }
        };
      }

      function onSave(e) {
        e.preventDefault();
        var form = readForm();
        var doc = state.draftNew ? null : currentDoc();
        var id = state.draftNew ? form.id : doc.id;
        if (!form.data.name) { $("save-status").textContent = "Name is required"; return; }
        if (state.draftNew && !/^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$/.test(id)) { $("save-status").textContent = "Id must be letters, digits, . _ : @ -"; return; }
        if (!state.draftNew) form.data.id = doc.id; else form.data.id = id;
        $("save").disabled = true;
        $("save-status").textContent = "Saving…";
        col.set(id, form.data, { ifRevision: state.draftNew ? 0 : doc.revision }).then(function (saved) {
          state.conflict = null;
          state.draftNew = false;
          upsertLocal(saved);
          state.selected = saved.id;
          renderList(); renderEditor();
          setStatus("Saved " + saved.data.name + " (revision " + saved.revision + ")");
        }).catch(function (err) {
          var s = $("save"); if (s) s.disabled = false;
          if (err && err.code === "conflict") {
            state.conflict = { attempted: form.data, current: err.current || null };
            if (err.current) upsertLocal(err.current); else removeLocal(id);
            renderConflict();
            var ss = $("save-status"); if (ss) ss.textContent = "Not saved: the brief changed since you loaded it.";
          } else { var st = $("save-status"); if (st) st.textContent = "Not saved"; fail(err); }
        });
      }

      function renderConflict() {
        var c = state.conflict, el = $("conflict");
        if (!el) return;
        if (!c) { el.innerHTML = ""; return; }
        el.innerHTML = '<div class="conflict"><h3>Someone else changed this brief</h3>' +
          '<p>The server has a newer version' + (c.current ? ' (revision ' + c.current.revision + (c.current.updatedBy ? ', by <code>' + escapeHtml(c.current.updatedBy) + '</code>' : "") + ')' : ' (the document was deleted)') + '. Your edit was not saved. Compare, then reload to edit the current version.</p>' +
          '<div class="compare"><div><strong>Your version</strong><pre>' + escapeHtml(JSON.stringify(c.attempted, null, 2)) + '</pre></div>' +
          '<div><strong>Current on server</strong><pre>' + escapeHtml(c.current ? JSON.stringify(c.current.data, null, 2) : "(deleted)") + '</pre></div></div>' +
          '<div class="actions"><button type="button" id="conflict-reload" class="primary">Reload current version</button></div></div>';
        $("conflict-reload").onclick = function () { state.conflict = null; state.draftNew = false; if (!c.current) state.selected = null; renderList(); renderEditor(); };
      }

      function onDelete() {
        var doc = currentDoc(); if (!doc) return;
        col.delete(doc.id, { ifRevision: doc.revision }).then(function () {
          removeLocal(doc.id); state.selected = null; state.confirmDelete = false;
          renderList(); renderEditor(); setStatus("Deleted " + (doc.data.name || doc.id));
        }).catch(function (err) {
          state.confirmDelete = false;
          if (err && err.code === "conflict") { if (err.current) upsertLocal(err.current); renderList(); renderEditor(); banner("warn", "The brief changed before it could be deleted. Review the current version first."); }
          else fail(err);
        });
      }

      function upsertLocal(doc) {
        var i = state.items.findIndex(function (d) { return d.id === doc.id; });
        if (i >= 0) state.items[i] = doc; else state.items.push(doc);
        state.items.sort(function (a, b) { return (a.data.name || "").localeCompare(b.data.name || ""); });
      }
      function removeLocal(id) { state.items = state.items.filter(function (d) { return d.id !== id; }); }

      function load() {
        setStatus("Loading…");
        return col.meta().then(function (m) {
          state.canWrite = m.canWrite; state.blockedReason = m.writeBlockedReason;
          $("new").disabled = !m.canWrite;
          if (m.frozen) banner("error", "This collection is frozen; reads and writes are blocked.");
          else if (!m.canWrite) banner("warn", "You can read these briefs but cannot edit them from this tool. The collection owner must grant you as a writer and grant this tool as a writer context." + (m.writeBlockedReason ? ' <span>(reason: <code>' + escapeHtml(m.writeBlockedReason) + '</code>)</span>' : ""));
          else banner();
          return col.list({ limit: 200 });
        }).then(function (r) {
          state.items = r.items.slice().sort(function (a, b) { return (a.data.name || "").localeCompare(b.data.name || ""); });
          state.revision = r.revision;
          renderList(); renderEditor();
          setStatus(state.items.length + " briefs · collection revision " + r.revision + (state.canWrite ? " · you can edit" : " · read only"));
        }).catch(function (err) {
          if (err && err.code === "not_found") banner("warn", "This tool has no binding named <code>company-briefs</code>. A maintainer can bind the collection from the tool's detail page in the portal.");
          else fail(err);
          setStatus("");
        });
      }

      $("list").addEventListener("click", function (e) { var btn = e.target.closest("button[data-id]"); if (!btn) return; state.selected = btn.getAttribute("data-id"); state.draftNew = false; state.conflict = null; state.confirmDelete = false; renderList(); renderEditor(); var d = currentDoc(); if (d) kitlane.shell.setTitle("Edit " + d.data.name); });
      $("new").addEventListener("click", function () { state.draftNew = true; state.conflict = null; state.confirmDelete = false; renderList(); renderEditor(); var n = $("f-id"); if (n) n.focus(); });
      $("reload").addEventListener("click", load);
      $("export").addEventListener("click", function () {
        var blob = new Blob([JSON.stringify(state.items.map(function (d) { return d.data; }), null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a"); a.href = url; a.download = "company-briefs.json"; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      });

      kitlane.tool().then(function (t) {
        if (!t.bindings.some(function (b) { return b.name === "company-briefs"; })) {
          banner("warn", "This tool has no binding named <code>company-briefs</code>. A maintainer can bind the collection from the tool's detail page in the portal.");
          setStatus("");
          return;
        }
        return load();
      }).catch(fail);
    })();
  </script>
</body>
</html>
